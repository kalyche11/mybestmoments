[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # Timeout extendido para backfill: analizar imágenes con OpenAI puede tardar varios segundos por recuerdo
  node_bundler = "esbuild"

[functions.backfillImageTags]
  timeout = 300

[dev]
  framework = "#custom"
  command = "npm run dev -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888
  autoLaunch = false
